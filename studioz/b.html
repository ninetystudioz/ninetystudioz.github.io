<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ninety Studioz — Board</title>
<!-- v6.07: shared board for people outside the system (view / comment). Data from the board-share function (studio project). -->
<style>
:root{--bg:#f4f5f7;--dot:rgba(20,30,45,.16);--ink:#1a1a1a;--line:#5b6673;--frame:#fff;--ui:#fff;--uiink:#1f2933;--mute:#69737f;--uil:rgba(15,23,42,.1);--acc:#2d6cdf}
body.dark{--bg:#14171c;--dot:rgba(255,255,255,.1);--ink:#eef1f4;--line:#a3afbd;--frame:#1d2128;--ui:#22262d;--uiink:#e9edf1;--mute:#9aa4af;--uil:rgba(255,255,255,.1)}

#world{position:absolute;left:0;top:0;transform-origin:0 0}
.i{position:absolute;color:var(--ink)}.i .t{width:100%;height:100%;white-space:pre-wrap;word-break:break-word;overflow:hidden;line-height:1.3;unicode-bidi:plaintext}

<body>

<script>
(() => {
  const FN = 'https://rekmppawmxerlqxqpqni.supabase.co/functions/v1/board-share';

             en: { view: 'View only', comment: 'View & comment — tap any item to comment', comments: 'Comments', none: 'No comments yet', name: 'Your name', text: 'Your comment…', send: 'Send', pass: 'This board is password protected', passph: 'Password', open: 'Open', wrong: 'Wrong password', expired: 'This link has expired — ask for a new one', gone: 'This link is not active', err: 'Something went wrong — try again', sent: 'Comment sent', loading: 'Loading…', lang: 'عربي', eTitle: 'Quick question from the studio', eName: 'Your name', eSend: 'Send', eDone: 'Your answer is in ✓ — you can change it until the time ends', eMulti: 'You can pick more than one', eText: 'Write your answer', eWords: 'A word or two', eEnd: 'ends in', eNeed: 'Write your name first' } };
  let L = (() => { try { return localStorage.getItem('nbs.lang') || ((navigator.language || '').startsWith('ar') ? 'ar' : 'en'); } catch (e) { return 'ar'; } })();
  const t = k => T[L][k]; const $ = id => document.getElementById(id);
  const tok = (location.hash.match(/t=([A-Za-z0-9_-]+)/) || [])[1] || ''; let pass = ''; let B = null; let V = { z: 1, x: 0, y: 0 }; let selId = null;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r1 = v => Math.round(v * 10) / 10;
  function applyLang() { document.documentElement.lang = L; document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr'; $('lang').textContent = t('lang'); $('pname').placeholder = t('name'); $('ptext').placeholder = t('text'); $('psend').textContent = t('send'); $('ptitle').textContent = t('comments'); $('mpass').placeholder = t('passph'); $('mgo').textContent = t('open'); if (B) $('mode').textContent = '· ' + t(B.mode); panel(); }
  $('lang').onclick = () => { L = L === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('nbs.lang', L); } catch (e) {} applyLang(); };
  function msg(text, askPass) { $('msg').style.display = 'flex'; $('mtext').textContent = text; $('mform').style.display = askPass ? 'flex' : 'none'; if (askPass) setTimeout(() => $('mpass').focus(), 50); }
  async function call(body) { const r = await fetch(FN, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ t: tok, p: pass }, body)) }); let j = {}; try { j = await r.json(); } catch (e) {} return { s: r.status, j }; }
  /* v6.17 Engage: the studio's live question, answered from the share link */
  let E = null, En = 0, Emine = null;
  const sget = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }; const sset = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  async function engPoll() { if (!B) return; try { const { s, j } = await call({ action: 'engage' }); if (s !== 200) return; const a = j.act; if (!a) { E = null; engDraw(); return; } if (!E || E.id !== a.id) { Emine = (() => { try { return JSON.parse(sget('nbs.ans.' + a.id) || 'null'); } catch (e) { return null; } })(); } E = a; En = j.n || 0; engDraw(); } catch (e) {} }
  function engDraw() {
    const el = $('eng'); if (!E) { el.style.display = 'none'; el.innerHTML = ''; return; } const ae = document.activeElement; if (ae && el.contains(ae) && ae.tagName === 'INPUT') return;
    const left = E.end ? Math.max(0, Math.round((E.end - Date.now()) / 1000)) : null; const sv = new Set(Array.isArray(Emine) ? Emine : Emine != null ? [Emine] : []);
    let inner = '';
    if (E.type === 'poll' || E.type === 'vote') inner = `<div class="opts ${E.type === 'vote' ? 'img' : ''}">${E.opts.map(o => `<button data-eo="${esc(o.id)}" class="${sv.has(o.id) ? 'on' : ''}">${o.thumb ? `<img src="${esc(o.thumb)}" alt="">` : ''}<span>${esc(o.t)}</span></button>`).join('')}</div>${E.multi ? `<div class="ft">${t('eMulti')}</div>` : ''}`;
    else if (E.type === 'rate') inner = `<div class="rate">${[1, 2, 3, 4, 5].map(k => `<button data-er="${k}" class="${+Emine >= k ? 'on' : ''}">★</button>`).join('')}</div>`;
    else inner = `<form class="row" id="etxt"><input id="ev" maxlength="${E.type === 'words' ? 60 : 300}" placeholder="${t(E.type === 'words' ? 'eWords' : 'eText')}" value="${esc(typeof Emine === 'string' ? Emine : '')}"><button class="btnp" type="submit">${t('eSend')}</button></form>`;
    el.innerHTML = `<div class="row"><span class="pill">${t('eTitle')}</span><span style="flex:1"></span>${left != null ? `<span class="ft">${t('eEnd')} ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</span>` : ''}</div><div class="q">${esc(E.q)}</div>${inner}<div class="row"><input id="ename" maxlength="60" placeholder="${t('eName')}" value="${esc(sget('nbs.name') || $('pname').value || '')}"></div>${Emine != null ? `<div class="ft">${t('eDone')}</div>` : ''}`;
    el.style.display = 'flex';
  }
  async function engSend(v) { const name = (($('ename') || {}).value || '').trim(); if (!name) { alert(t('eNeed')); return; } sset('nbs.name', name); const { s } = await call({ action: 'answer', act: E.id, name, v }); if (s === 200) { Emine = v; sset('nbs.ans.' + E.id, JSON.stringify(v)); engDraw(); } else alert(t('err')); }
  $('eng').addEventListener('click', e => { const o = e.target.closest('[data-eo]'); if (o && E) { const id = o.dataset.eo; let v; if (E.multi) { const cur = new Set(Array.isArray(Emine) ? Emine : []); cur.has(id) ? cur.delete(id) : cur.add(id); v = [...cur]; } else v = [id]; return engSend(v); } const r = e.target.closest('[data-er]'); if (r && E) return engSend(+r.dataset.er); });
  $('eng').addEventListener('submit', e => { if (e.target.id !== 'etxt') return; e.preventDefault(); const v = ($('ev').value || '').trim(); if (v) engSend(v); });
  setInterval(() => { if (document.hidden) return; engPoll(); }, 6000); setInterval(() => { if (E && E.end) { const el = $('eng'); const ae = document.activeElement; if (!(ae && el.contains(ae))) engDraw(); } }, 1000);
  async function load() {
    if (!tok) return msg(t('gone')); msg(t('loading'));
    const { s, j } = await call({ action: 'get' });
    if (s === 401) return msg(pass ? t('wrong') : t('pass'), true); if (s === 410) return msg(t('expired')); if (s !== 200) return msg(s === 404 ? t('gone') : t('err'));
    $('msg').style.display = 'none'; B = j; document.body.classList.toggle('dark', j.bg === 'dark'); $('ttl').textContent = j.title; document.title = j.title + ' — Ninety Studioz'; applyLang(); draw(); fit(); engPoll();
  }
  $('mform').onsubmit = e => { e.preventDefault(); pass = $('mpass').value; load(); };
  /* geometry — same as the in-app board */
  function shapeD(k, w, h) { switch (k) { case 'round': { const r = Math.min(18, w / 4, h / 4); return `M${r},0H${w - r}Q${w},0 ${w},${r}V${h - r}Q${w},${h} ${w - r},${h}H${r}Q0,${h} 0,${h - r}V${r}Q0,0 ${r},0Z`; } case 'ellipse': return `M${w / 2},0A${w / 2},${h / 2} 0 1,1 ${w / 2},${h}A${w / 2},${h / 2} 0 1,1 ${w / 2},0Z`; case 'tri': return `M${w / 2},0L${w},${h}L0,${h}Z`; case 'diamond': return `M${w / 2},0L${w},${h / 2}L${w / 2},${h}L0,${h / 2}Z`; case 'hex': { const d = w * 0.22; return `M${d},0H${w - d}L${w},${h / 2}L${w - d},${h}H${d}L0,${h / 2}Z`; } case 'para': { const d = w * 0.2; return `M${d},0H${w}L${w - d},${h}H0Z`; } case 'star': { let s = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? 0.45 : 1; s += (i ? 'L' : 'M') + r1(w / 2 + Math.cos(a) * w / 2 * q) + ',' + r1(h * 0.53 + Math.sin(a) * h * 0.53 * q); } return s + 'Z'; } case 'arrow': { const tt = Math.min(w * 0.4, h); return `M0,${h * 0.28}H${w - tt}V0L${w},${h / 2}L${w - tt},${h}V${h * 0.72}H0Z`; } case 'cyl': { const e = Math.min(h * 0.14, 26); return `M0,${e}A${w / 2},${e} 0 0,1 ${w},${e}V${h - e}A${w / 2},${e} 0 0,1 0,${h - e}ZM0,${e}A${w / 2},${e} 0 0,0 ${w},${e}`; } case 'callout': { const tt = Math.min(h * 0.22, 30), r = Math.min(14, w / 5, h / 5), b = h - tt; return `M${r},0H${w - r}Q${w},0 ${w},${r}V${b - r}Q${w},${b} ${w - r},${b}H${w * 0.42}L${w * 0.24},${h}L${w * 0.28},${b}H${r}Q0,${b} 0,${b - r}V${r}Q0,0 ${r},0Z`; } default: return `M0,0H${w}V${h}H0Z`; } }
  const R = i => ({ x: +i.x || 0, y: +i.y || 0, w: +i.w || 160, h: +i.h || 160 }); const byId = id => B.items.find(i => i.id === id);
  const SIDES = { n: [0.5, 0, 0, -1], e: [1, 0.5, 1, 0], s: [0.5, 1, 0, 1], w: [0, 0.5, -1, 0] };
  const anchor = (it, s) => { const r = R(it), d = SIDES[s]; return { x: r.x + r.w * d[0], y: r.y + r.h * d[1], nx: d[2], ny: d[3] }; };
  const best = (it, tx, ty) => { const r = R(it); const dx = (tx - (r.x + r.w / 2)) / (r.w || 1), dy = (ty - (r.y + r.h / 2)) / (r.h || 1); return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'e' : 'w') : (dy > 0 ? 's' : 'n'); };
  const ax = (p, q) => { const dx = q.x - p.x, dy = q.y - p.y; return Math.abs(dx) > Math.abs(dy) ? { x: Math.sign(dx) || 1, y: 0 } : { x: 0, y: Math.sign(dy) || 1 }; };
  function conn(c) {
    const A = c.from ? byId(c.from) : null, Bb = c.to ? byId(c.to) : null; if ((c.from && !A) || (c.to && !Bb)) return '';
    const ca = A ? { x: R(A).x + R(A).w / 2, y: R(A).y + R(A).h / 2 } : { x: +c.x1, y: +c.y1 }, cb = Bb ? { x: R(Bb).x + R(Bb).w / 2, y: R(Bb).y + R(Bb).h / 2 } : { x: +c.x2, y: +c.y2 };
    const a = A ? anchor(A, c.fs && c.fs !== 'auto' ? c.fs : best(A, cb.x, cb.y)) : { x: ca.x, y: ca.y }, b = Bb ? anchor(Bb, c.ts && c.ts !== 'auto' ? c.ts : best(Bb, ca.x, ca.y)) : { x: cb.x, y: cb.y };
    if (!A) { const d = ax(a, b); a.nx = d.x; a.ny = d.y; } if (!Bb) { const d = ax(b, a); b.nx = d.x; b.ny = d.y; }
    let d, ev; const st = c.style || 'curve';
    if (st === 'line') { d = `M${a.x},${a.y}L${b.x},${b.y}`; ev = { x: b.x - a.x, y: b.y - a.y }; }
    else if (st === 'elbow') { const o = 24, p1 = { x: a.x + a.nx * o, y: a.y + a.ny * o }, p2 = { x: b.x + b.nx * o, y: b.y + b.ny * o }; const pts = a.nx ? (b.nx ? [a, p1, { x: (p1.x + p2.x) / 2, y: p1.y }, { x: (p1.x + p2.x) / 2, y: p2.y }, p2, b] : [a, p1, { x: p2.x, y: p1.y }, p2, b]) : (b.ny ? [a, p1, { x: p1.x, y: (p1.y + p2.y) / 2 }, { x: p2.x, y: (p1.y + p2.y) / 2 }, p2, b] : [a, p1, { x: p1.x, y: p2.y }, p2, b]); d = 'M' + pts.map(p => `${r1(p.x)},${r1(p.y)}`).join('L'); ev = { x: b.x - pts[pts.length - 2].x, y: b.y - pts[pts.length - 2].y }; }
    else { const Lh = Math.max(40, Math.hypot(b.x - a.x, b.y - a.y) / 3); const c2 = { x: b.x + b.nx * Lh, y: b.y + b.ny * Lh }; d = `M${a.x},${a.y}C${a.x + a.nx * Lh},${a.y + a.ny * Lh} ${c2.x},${c2.y} ${b.x},${b.y}`; ev = { x: b.x - c2.x, y: b.y - c2.y }; }
    const col = c.color || 'var(--line)', w = c.width || 2; let h = ''; const l = Math.hypot(ev.x, ev.y); if (c.ah !== false && l) { const ux = ev.x / l, uy = ev.y / l, s = 9 + w * 2, bx = b.x - ux * s, by = b.y - uy * s; h = `<path d="M${b.x},${b.y}L${bx - uy * s / 2},${by + ux * s / 2}L${bx + uy * s / 2},${by - ux * s / 2}Z" fill="${col}"/>`; }
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" ${c.dash ? `stroke-dasharray="${w * 4} ${w * 3}"` : ''}/>${h}`;
  }
  const strokeD = p => { if (!p || !p.length) return ''; let d = `M${p[0][0]},${p[0][1]}`; for (let k = 1; k < p.length; k++) d += `L${p[k][0]},${p[k][1]}`; return d; };
  function draw() {
