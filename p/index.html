<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product</title><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff">
<style>
:root{--ac:#1d5fd1;--ink:#111;--bg:#fff;--mut:#6b7280;--line:#e5e7eb;--card:#fff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.logo{height:38px;display:flex;align-items:center}.logo svg,.logo img{height:100%;width:auto;max-width:180px}.bname{font-weight:800;font-size:20px;color:var(--ac)}
.lang{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
h1{font-size:26px;margin:18px 0 2px}.code{color:var(--mut);font-size:13px;letter-spacing:.3px}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:16px}
.stage{border-radius:18px;overflow:hidden;background:#f4f5f7;aspect-ratio:4/3;position:relative}
.stage img,.stage model-viewer{width:100%;height:100%;object-fit:contain;display:block;background:#f4f5f7}
.tabs{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:transparent}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}.thumbs button{flex:none;border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;background:none;cursor:pointer}.thumbs button.on{border-color:var(--ac)}.thumbs img{width:76px;height:58px;object-fit:cover;display:block}
.side{display:flex;flex-direction:column;gap:12px}
.kv{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--card)}.kv div{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.kv div:last-child{border:0}.kv b{min-width:96px;color:var(--mut);font-weight:600;font-size:13px}
.desc{white-space:pre-wrap;color:#333}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:inherit;text-decoration:none;cursor:pointer;min-height:48px}
.btn.p{background:var(--ac);color:#fff;border-color:transparent}.btn:disabled{opacity:.5}
.ok{border-radius:16px;padding:14px;background:color-mix(in srgb,#1f9d55 12%,var(--card));border:1px solid color-mix(in srgb,#1f9d55 40%,var(--line))}
.ap{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.ap input,.ap textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;background:var(--bg);color:inherit}
.muted{color:var(--mut);font-size:13px}.msg{text-align:center;padding:60px 16px}.msg h2{margin:0 0 6px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);margin:80px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}

.stage.deck{aspect-ratio:auto;height:min(78vh,760px)}.stage iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.stage.im{aspect-ratio:auto;min-height:220px;display:flex;align-items:center;justify-content:center}.pw{position:relative;display:inline-block;max-width:100%;line-height:0}.pw img{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;object-fit:contain}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font:700 13px/28px sans-serif;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff;pointer-events:none}.pin.new{background:#e11d48}
.hs{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;border:2px solid #fff;font:700 13px/24px sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35);padding:0}.hs.new{background:#e11d48}
.pinbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pinbar .btn{min-height:42px;padding:9px 14px;font-size:14px}.btn.on{background:#e11d48;color:#fff;border-color:transparent}
.hint{margin-top:8px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,#e11d48 10%,var(--card));color:#9f1239;font-size:13px}
.nf{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:8px;background:var(--card)}.nf input,.nf textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);color:inherit}
.notes{display:flex;flex-direction:column;gap:6px}.note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--card)}.note i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;font:700 12px/24px sans-serif;font-style:normal;text-align:center}.note small{color:var(--mut)}
.chg{border-radius:14px;padding:10px 14px;margin-top:12px;background:color-mix(in srgb,var(--ac) 12%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--line))}
footer{margin-top:26px;color:var(--mut);font-size:12px;text-align:center}
@media (max-width:760px){.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body><div class="wrap" id="app"><div class="spin"></div></div>
<script>
(function(){
  var FN='https://erhcnkjyaumdoixkksbz.supabase.co/functions/v1/pd-share';
  var s=(new URLSearchParams(location.search)).get('s')||'';
  var D=null, L='ar', view={tab:'img',i:0}, pin=null, mode='', deckUrl='';
  var NM='';try{NM=localStorage.getItem('nf.p.name')||''}catch(e){}
  var TX={ar:{size:'المقاسات',finish:'التشطيب',code:'الكود',ds:'حمّل الداتاشيت (PDF)',pics:'الصور',d3:'3D',appr:'موافق على التصميم',name:'اسمك',note:'ملاحظة (اختياري)',send:'تأكيد الموافقة',done:'تم تسجيل موافقتك — شكرًا',by:'وافق',exp:'اللينك صالح لحد',gone:'اللينك ده مش متاح',expired:'اللينك ده انتهى',stopped:'اللينك ده اتقفل',ask:'تواصل معانا عشان نبعتلك لينك جديد.',err:'حصلت مشكلة — جرّب تاني',other:'English',none:'الصور بتتجهّز…',deck:'العرض',pinI:'📍 علّق على الصورة',pin3:'📍 علّق على الـ3D',pinD:'✎ ملاحظة على العرض',gen:'✎ ملاحظة عامة',tap:'اضغط على المكان اللي عايز تعلّق عليه',notesH:'ملاحظاتك',noteP:'اكتب ملاحظتك…',sendN:'ابعت الملاحظة',cancel:'إلغاء',sent:'وصلت ملاحظتك — شكرًا',changed:'اتعدّل التصميم بعد ملاحظاتك — دي النسخة الجديدة',deckL:'العرض بيتحمّل…',full:'ملء الشاشة',tm:'وصلت لأقصى عدد ملاحظات للينك ده',onI:'على الصورة',on3:'على الـ3D',onD:'على العرض',onG:'عامة'},
         en:{size:'Size',finish:'Finish',code:'Code',ds:'Download the datasheet (PDF)',pics:'Pictures',d3:'3D',appr:'I approve this design',name:'Your name',note:'A note (optional)',send:'Confirm approval',done:'Your approval is recorded — thank you',by:'Approved by',exp:'Link valid until',gone:'This link is not available',expired:'This link has expired',stopped:'This link was closed',ask:'Contact us and we will send a new one.',err:'Something went wrong — try again',other:'عربي',none:'Pictures are being prepared…',deck:'Presentation',pinI:'📍 Note on the picture',pin3:'📍 Note on the 3D',pinD:'✎ Note on the presentation',gen:'✎ General note',tap:'Tap the spot you want to comment on',notesH:'Your notes',noteP:'Write your note…',sendN:'Send the note',cancel:'Cancel',sent:'Your note arrived — thank you',changed:'The design was updated after your notes — this is the new version',deckL:'Loading the presentation…',full:'Full screen',tm:'This link reached its maximum number of notes',onI:'on the picture',on3:'on the 3D',onD:'on the presentation',onG:'general'}};
  var t=function(k){return (TX[L]||TX.ar)[k]||k};
  var esc=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var $=function(q){return document.querySelector(q)};
  function call(b){return fetch(FN,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
  function theme(b){if(!b)return;var r=document.documentElement.style;if(b.accent)r.setProperty('--ac',b.accent);if(b.ink)r.setProperty('--ink',b.ink);if(b.bg&&!/^#fff(fff)?$/i.test(b.bg))r.setProperty('--bg',b.bg);var m=document.querySelector('meta[name=theme-color]');if(m&&b.accent)m.setAttribute('content',b.accent)}
  function logo(b){if(!b)return '';if(b.svg)return '<div class="logo">'+b.svg+'</div>';if(b.logo)return '<div class="logo"><img alt="" src="'+esc(b.logo)+'"></div>';return '<div class="bname">'+esc(b.name||'')+'</div>'}
  function setLang(l){L=l==='en'?'en':'ar';document.documentElement.lang=L;document.documentElement.dir=L==='en'?'ltr':'rtl'}
  function head(){var b=D&&D.brand;return '<header>'+logo(b)+'<button class="lang" id="lg">'+esc(t('other'))+'</button></header>'}
  function msg(k){$('#app').innerHTML=head()+'<div class="msg"><h2>'+esc(t(k))+'</h2><p class="muted">'+esc(t('ask'))+'</p></div>';bind()}
  function fmtD(x){try{return new Date(x).toLocaleDateString(L==='en'?'en-GB':'ar-EG',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}
  var mvP=null;function mv(){if(window.customElements&&customElements.get('model-viewer'))return Promise.resolve();if(!mvP)mvP=new Promise(function(ok,no){var sc=document.createElement('script');sc.type='module';sc.src='https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});return mvP}
  function pinsFor(kind,i){return (D.notes||[]).filter(function(n){return n.target&&n.target.kind===kind&&(kind!=='img'||n.target.i===i)})}
  function stage(){var p=D.images||[];
    if(view.tab==='deck'&&D.deck){return '<iframe id="dk" title="" sandbox="allow-scripts allow-pointer-lock allow-popups allow-modals" allow="fullscreen; xr-spatial-tracking"></iframe>'}
    if(view.tab==='3d'&&D.model){mv().catch(function(){});var hs=pinsFor('3d').map(function(n){var q=n.target.pos||{};return '<button class="hs" slot="hotspot-'+n.n+'" data-position="'+q.x+'m '+q.y+'m '+q.z+'m">'+n.n+'</button>'}).join('')+(pin&&pin.kind==='3d'?'<button class="hs new" slot="hotspot-new" data-position="'+pin.pos.x+'m '+pin.pos.y+'m '+pin.pos.z+'m">•</button>':'');
      return '<model-viewer id="mvw" src="'+esc(D.model.u)+'" camera-controls '+(mode?'':'auto-rotate ')+'shadow-intensity="1" touch-action="pan-y" ar ar-modes="webxr scene-viewer quick-look" alt="">'+hs+'</model-viewer>'}
    var im=p[view.i]||p[0];if(!im)return '<div class="msg muted">'+esc(t('none'))+'</div>';
    var pins=pinsFor('img',view.i).map(function(n){return '<span class="pin" style="left:'+(n.target.x*100)+'%;top:'+(n.target.y*100)+'%">'+n.n+'</span>'}).join('')+(pin&&pin.kind==='img'?'<span class="pin new" style="left:'+(pin.x*100)+'%;top:'+(pin.y*100)+'%">•</span>':'');
    return '<div class="pw" id="pw"><img alt="" id="sim" src="'+esc(im.u)+'">'+pins+'</div>'}
  function tgName(n){var k=n.target&&n.target.kind;return k==='img'?t('onI')+(n.target.i!=null?' '+(n.target.i+1):''):k==='3d'?t('on3'):k==='deck'?t('onD'):t('onG')}
  function noteForm(){if(!mode||(mode!=='gen'&&mode!=='deck'&&!pin))return '';return '<form class="nf" id="nff"><b>'+esc(pin?'📍':'✎')+' '+esc(mode==='deck'?t('onD'):mode==='gen'?t('onG'):pin.kind==='3d'?t('on3'):t('onI'))+'</b><input name="n" required minlength="2" maxlength="80" autocomplete="name" placeholder="'+esc(t('name'))+'" value="'+esc(NM)+'"><textarea name="m" rows="3" required minlength="2" maxlength="600" placeholder="'+esc(t('noteP'))+'"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" type="submit">'+esc(t('sendN'))+'</button><button class="btn" type="button" id="nfc">'+esc(t('cancel'))+'</button></div></form>'}
  function pinBar(){var b='';if(view.tab==='img'&&(D.images||[]).length)b+='<button class="btn'+(mode==='img'?' on':'')+'" data-mode="img">'+esc(t('pinI'))+'</button>';if(view.tab==='3d'&&D.model)b+='<button class="btn'+(mode==='3d'?' on':'')+'" data-mode="3d">'+esc(t('pin3'))+'</button>';if(view.tab==='deck'&&D.deck)b+='<button class="btn'+(mode==='deck'?' on':'')+'" data-mode="deck">'+esc(t('pinD'))+'</button><button class="btn" id="dkf">⛶ '+esc(t('full'))+'</button>';b+='<button class="btn'+(mode==='gen'?' on':'')+'" data-mode="gen">'+esc(t('gen'))+'</button>';
    return '<div class="pinbar">'+b+'</div>'+((mode==='img'||mode==='3d')&&!pin?'<div class="hint">'+esc(t('tap'))+'</div>':'')+noteForm()}
  function notesList(){var ns=D.notes||[];if(!ns.length)return '';return '<b>'+esc(t('notesH'))+'</b><div class="notes">'+ns.map(function(n){return '<div class="note"><i>'+n.n+'</i><div><div>'+esc(n.text)+'</div><small>'+esc(tgName(n))+' · '+esc(n.name)+' · '+esc(fmtD(n.at))+'</small></div></div>'}).join('')+'</div>'}
  function render(){
    var P=D.product||{},nm=(L==='en'&&P.nameEn)||P.name,ds=(L==='en'&&P.descEn)||P.desc;document.title=(nm||'')+(D.brand&&D.brand.name?' — '+D.brand.name:'');
    var rows=[[t('code'),P.code],[t('size'),P.dims],[t('finish'),P.finish]].filter(function(r){return r[1]});
    var ap=D.approved?'<div class="ok"><b>✓ '+esc(t('done'))+'</b><div class="muted">'+esc(t('by'))+': '+esc(D.approved.name)+' · '+esc(fmtD(D.approved.at))+'</div></div>'
      :'<form class="ap" id="apf"><b>'+esc(t('appr'))+'</b><input name="n" required minlength="2" maxlength="80" autocomplete="name" placeholder="'+esc(t('name'))+'"><textarea name="m" rows="2" maxlength="500" placeholder="'+esc(t('note'))+'"></textarea><button class="btn p" type="submit">✓ '+esc(t('send'))+'</button></form>';
    var tb=[];if((D.images||[]).length)tb.push(['img',t('pics')]);if(D.model)tb.push(['3d',t('d3')]);if(D.deck)tb.push(['deck',t('deck')]);
    $('#app').innerHTML=head()+(D.changed?'<div class="chg">✨ '+esc(t('changed'))+'</div>':'')+'<h1>'+esc(nm||'')+'</h1><div class="code">'+esc(P.code||'')+'</div><div class="grid"><div><div class="stage'+(view.tab==='deck'?' deck':view.tab==='img'?' im':'')+'" id="st">'+stage()+'</div>'
      +(tb.length>1?'<div class="tabs">'+tb.map(function(x){return '<button data-tab="'+x[0]+'" class="'+(view.tab===x[0]?'on':'')+'">'+esc(x[1])+'</button>'}).join('')+'</div>':'')
      +(view.tab==='img'&&(D.images||[]).length>1?'<div class="thumbs">'+D.images.map(function(x,i){return '<button data-i="'+i+'" class="'+(i===view.i?'on':'')+'"><img alt="" loading="lazy" src="'+esc(x.u)+'"></button>'}).join('')+'</div>':'')
      +pinBar()+notesList()+'</div><div class="side">'+(rows.length?'<div class="kv">'+rows.map(function(r){return '<div><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>'}).join('')+'</div>':'')
      +(ds?'<div class="desc">'+esc(ds)+'</div>':'')+(D.datasheet?'<a class="btn" target="_blank" rel="noopener" href="'+esc(D.datasheet.u)+'">⬇ '+esc(t('ds'))+'</a>':'')+ap
      +'</div></div><footer>'+esc(t('exp'))+' '+esc(fmtD(D.exp))+(D.brand&&D.brand.name?' · '+esc(D.brand.name):'')+'</footer>';
    bind();
  }
  function toast(m){var d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:9;max-width:90vw';document.body.appendChild(d);setTimeout(function(){d.remove()},2600)}
  function bind(){var lg=$('#lg');if(lg)lg.onclick=function(){setLang(L==='en'?'ar':'en');D&&D.ok?render():msg(D&&D.error||'gone')};
    document.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){view.tab=b.dataset.tab;mode='';pin=null;render()}});
    document.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){mode=mode===b.dataset.mode?'':b.dataset.mode;pin=null;render();var f=$('#nff');if(f&&f.m)f.m.focus()}});
    var c=$('#nfc');if(c)c.onclick=function(){mode='';pin=null;render()};
    var sim=$('#sim');if(sim&&mode==='img')sim.onclick=function(e){var r=sim.getBoundingClientRect();pin={kind:'img',i:view.i,img:((D.images||[])[view.i]||{}).name||'',x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};render();var f=$('#nff');if(f&&f.m)f.m.focus()};
    var mvw=$('#mvw');if(mvw&&mode==='3d')mvw.addEventListener('click',function(e){try{var h=mvw.positionAndNormalFromPoint(e.clientX,e.clientY);if(h&&h.position){pin={kind:'3d',pos:{x:h.position.x,y:h.position.y,z:h.position.z}};render();var f=$('#nff');if(f&&f.m)f.m.focus()}}catch(x){}});
    var dk=$('#dk');if(dk&&D.deck){if(deckUrl)dk.src=deckUrl;else{dk.srcdoc='<p style="font:15px sans-serif;text-align:center;margin-top:30vh;color:#666">'+esc(t('deckL'))+'</p>';fetch(D.deck.u).then(function(r){return r.blob()}).then(function(b){deckUrl=URL.createObjectURL(new Blob([b],{type:'text/html'}));var d2=$('#dk');if(d2){d2.removeAttribute('srcdoc');d2.src=deckUrl}}).catch(function(){var d2=$('#dk');if(d2)d2.srcdoc='<p style="font:15px sans-serif;text-align:center;margin-top:30vh">'+esc(t('err'))+'</p>'})}}
    var fs=$('#dkf');if(fs)fs.onclick=function(){var st=$('#st');try{(st.requestFullscreen||st.webkitRequestFullscreen).call(st)}catch(e){if(deckUrl)window.open(deckUrl,'_blank')}};
    var nff=$('#nff');if(nff)nff.onsubmit=function(e){e.preventDefault();var n=nff.n.value.trim(),m=nff.m.value.trim();if(n.length<2||m.length<2)return;NM=n;try{localStorage.setItem('nf.p.name',n)}catch(x){}var b=nff.querySelector('button[type=submit]');b.disabled=true;
      var tg=pin?pin:{kind:mode==='deck'?'deck':'gen'};
      call({action:'note',s:s,name:n,text:m,target:tg}).then(function(r){if(r&&r.ok){D.notes=(D.notes||[]).concat([r.note]);mode='';pin=null;render();toast(t('sent'))}else{b.disabled=false;alert(r&&r.error==='too_many'?t('tm'):t('err'))}}).catch(function(){b.disabled=false;alert(t('err'))})};
    document.querySelectorAll('[data-i]').forEach(function(b){b.onclick=function(){view.i=+b.dataset.i;render()}});
    if(!D||!D.images||!D.images.length){if(D&&D.model&&view.tab==='img'){view.tab='3d';render();return}if(D&&D.deck&&!D.model&&view.tab==='img'){view.tab='deck';render();return}}
    var f=$('#apf');if(f)f.onsubmit=function(e){e.preventDefault();var n=f.n.value.trim(),m=f.m.value.trim();if(n.length<2)return;var b=f.querySelector('button');b.disabled=true;
      call({action:'approve',s:s,name:n,note:m}).then(function(r){if(r&&r.ok){D.approved=r.approved;render()}else{b.disabled=false;alert(t('err'))}}).catch(function(){b.disabled=false;alert(t('err'))})}}
  if(!/^[a-z0-9]{6,16}$/.test(s)){setLang((navigator.language||'').indexOf('ar')===0?'ar':'en');D={ok:false,error:'gone'};msg('gone');return}
  call({action:'open',s:s}).then(function(r){D=r||{};setLang(D.lang);theme(D.brand);if(!D.ok){msg(D.error==='expired'||D.error==='stopped'?D.error:'gone');return}render()}).catch(function(){setLang('ar');D={ok:false,error:'err'};msg('err')});
})();
</script></body></html>
