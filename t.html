:root{--bg:#f4f5f7;--ink:#1a1a1a;--mute:#69737f;--card:#fff;--line:rgba(15,23,42,.1);--acc:#1b7f4b;--warn:#d98a00;--crit:#d93025}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}

.msg{padding:40px 20px;text-align:center;color:var(--mute);font-size:15px}
.car{width:34px;height:34px;border-radius:50%;background:#1b5fb4;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.dst{width:16px;height:16px;border-radius:50%;background:#d93025;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}

<header><div style="width:34px;height:34px;border-radius:9px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px">90</div><div><b id="co">…</b><div class="sub" id="sub">جارٍ التحميل…</div></div><div style="flex:1"></div><span class="badge grey" id="st">—</span></header>
<div id="map"></div>
<div class="panel" id="panel"><div class="msg full" id="msg">جارٍ تحميل بيانات الشحنة…</div></div>
<script src="./vendor/leaflet.js"></script>
<script src="./config.js"></script>
<script>
(function () {
  const t = new URLSearchParams(location.search).get('t') || '';
  const cfg = window.NF_CONFIG || {}; const base = (cfg.gpsBridgeUrl || (cfg.supabaseUrl ? cfg.supabaseUrl + '/functions/v1/gps-bridge' : ''));
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const ago = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'الآن' : m < 60 ? `منذ ${m} د` : `منذ ${Math.floor(m / 60)} س ${m % 60} د`; };
  let map = null, car = null, dst = null, line = null, fitted = false, timer = null;
  const STATUS = { planned: ['في الانتظار', 'grey'], approved: ['في الانتظار', 'grey'], started: ['في الطريق إليك', ''], done: ['تم التسليم', ''], cancelled: ['أُلغي', 'crit'] };
  function ensureMap() { if (map || !window.L) return; map = L.map('map', { zoomControl: true, attributionControl: true }).setView([30.05, 31.3], 11); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map); }
  function show(d) {
    if (!d.ok) { $('#msg').textContent = 'اللينك ده مش صحيح أو انتهى'; $('#sub').textContent = ''; return; }
    if (d.expired) { $('#msg').textContent = 'انتهت صلاحية اللينك — الشحنة اتسلّمت'; $('#st').textContent = 'انتهى'; $('#sub').textContent = ''; clearInterval(timer); return; }
    $('#co').textContent = d.company || 'Ninety'; const s = STATUS[d.trip.status] || [d.trip.status, 'grey']; $('#st').textContent = d.trip.arrivedAt && d.trip.status === 'started' ? 'وصلت' : s[0]; $('#st').className = 'badge ' + s[1];
    $('#sub').textContent = (d.trip.purpose || '') + (d.trip.to ? ' ← ' + d.trip.to : '');
    const p = d.pos; const rows = [];
    rows.push(`<div><div class="k">العربية</div><div class="v">${esc(d.vehicle ? d.vehicle.name : '—')}</div></div>`);
    rows.push(`<div><div class="k">السائق</div><div class="v">${esc(d.driver ? d.driver.name : '—')}</div></div>`);
    rows.push(`<div><div class="k">بداية المشوار</div><div class="v">${d.trip.startedAt ? hhmm(d.trip.startedAt) : '—'}</div></div>`);
    rows.push(`<div><div class="k">آخر تحديث للموقع</div><div class="v">${p && p.at ? ago(p.at) : '—'}${p && p.speed != null && p.moving !== false ? ` <span class="tiny">· ${Math.round(p.speed)} كم/س</span>` : ''}</div></div>`);
    if (!p) rows.push(`<div class="full tiny">${d.trip.status === 'started' ? 'الموقع هيظهر أول ما العربية تتحرك' : 'الموقع بيظهر لما المشوار يبدأ'}</div>`);
    rows.push(`<div class="full tiny">الصفحة بتتحدث لوحدها كل 20 ثانية · بيانات الموقع من جهاز التتبع في العربية</div>`);
    $('#panel').innerHTML = rows.join('');
    ensureMap(); if (!map) return;
    if (d.dest && d.dest.lat != null) { const ll = [d.dest.lat, d.dest.lng]; if (!dst) dst = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="dst"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map).bindTooltip('الوجهة', { permanent: true, direction: 'top', offset: [0, -8] }); else dst.setLatLng(ll); }
    if (p && p.lat != null) {
      const ll = [p.lat, p.lng];
      if (!car) car = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="car">🚚</div>', iconSize: [34, 34], iconAnchor: [17, 17] }) }).addTo(map); else car.setLatLng(ll);
      if (d.dest && d.dest.lat != null) { const path = [ll, [d.dest.lat, d.dest.lng]]; if (!line) line = L.polyline(path, { color: '#1b5fb4', weight: 2, dashArray: '6 6', opacity: .6 }).addTo(map); else line.setLatLngs(path); }
      if (!fitted) { fitted = true; if (d.dest && d.dest.lat != null) map.fitBounds(L.latLngBounds([ll, [d.dest.lat, d.dest.lng]]).pad(.25)); else map.setView(ll, 14); }
    } else if (d.dest && d.dest.lat != null && !fitted) { fitted = true; map.setView([d.dest.lat, d.dest.lng], 13); }
  }
  async function load() {
    if (!t || !base) { $('#msg').textContent = 'اللينك ناقص'; return; }
    try { const r = await fetch(base + '?action=share&t=' + encodeURIComponent(t), { cache: 'no-store' }); show(await r.json()); }
    catch (e) { $('#sub').textContent = 'مفيش اتصال — هنحاول تاني'; }
  }
  load(); timer = setInterval(load, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
