<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>lōf — Supply status</title>

<style>
/* lōf identity — claude/lof-design-md.md: white/warm paper, deep green ink, one gold hairline, square corners, light type (300/400/500), no shadows */
:root{--ink:#1a1a1a;--green:#2a5250;--green-2:#1f3f3d;--gold:#e2a300;--white:#fff;--paper:#faf8f4;--cream:#f4f1eb;--sand:#ece7dc;--line:#d6d0c4;--line-2:#e3ddd1;--text-2:#4f4c47;--muted:#6b675f;--ls:.18em;--ease-io:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--white);color:var(--ink);-webkit-text-size-adjust:100%}
body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.55;font-weight:300}
body.en{font-family:"IBM Plex Sans","IBM Plex Sans Arabic",Arial,sans-serif}
[dir=rtl]{--ls:0}
b,strong{font-weight:500}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}
.logo{display:inline-block;color:var(--ink);line-height:0}
.logo svg{height:100%;width:auto}
.kick{font-size:12px;font-weight:500;letter-spacing:var(--ls);text-transform:uppercase;color:var(--muted)}
[dir=rtl] .kick{text-transform:none}
/* header */
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line-2)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:76px}
.bar .logo{height:44px;margin-top:2px}
.bar .t{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:var(--ls);text-transform:uppercase;border-inline-start:1px solid var(--line);padding-inline-start:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
[dir=rtl] .bar .t{text-transform:none}
.bar .sp{flex:1}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:0;padding:0 16px;height:40px;font-size:14px;font-weight:500;white-space:nowrap;transition:background .3s var(--ease-io),color .3s var(--ease-io),border-color .3s var(--ease-io)}
.btn:hover{background:var(--green);border-color:var(--green);color:#fff}
.btn:focus-visible,.go:focus-visible{outline:2px solid var(--green);outline-offset:2px}
/* hero */
.hero{padding:clamp(44px,7vw,88px) 0 26px}
.eyebrow{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.eyebrow span{font-size:12px;font-weight:500;letter-spacing:var(--ls);text-transform:uppercase;color:var(--muted)}
[dir=rtl] .eyebrow span{text-transform:none}
.hero h1{font-size:clamp(36px,5.4vw,72px);line-height:1.08;margin:22px 0 14px;font-weight:300;color:var(--green);letter-spacing:-.01em}
.hero p{margin:0;color:var(--text-2);max-width:640px;font-size:clamp(16px,1.3vw,19px)}
.upd{margin-top:14px;font-size:13px;color:var(--muted)}
.goldrule{height:1px;background:var(--gold);width:72px;margin:26px 0 0}
/* figures */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:26px 0 0}
.kpi{padding:20px 22px;min-width:0;border-inline-start:1px solid var(--line)}
.kpi:first-child{border-inline-start:0;padding-inline-start:0}
.kpi .l{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:var(--ls);text-transform:uppercase}
[dir=rtl] .kpi .l{text-transform:none}
.kpi .v{font-size:clamp(34px,4vw,52px);font-weight:300;margin-top:4px;line-height:1.05}
.kpi.acc .v{color:var(--green)}
.bigbar{height:4px;background:var(--sand);overflow:hidden;margin:22px 0 8px}
.bigbar i{display:block;height:100%;background:var(--green)}
.bigcap{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
/* sections */
.sec{margin:clamp(48px,7vw,84px) 0 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sec h2{font-size:clamp(26px,3vw,40px);margin:0;font-weight:300;color:var(--green);line-height:1.1}
.sec span{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:var(--ls);text-transform:uppercase;white-space:nowrap}
[dir=rtl] .sec span{text-transform:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:0;padding:24px;min-width:0;display:flex;flex-direction:column;break-inside:avoid;position:relative;transition:border-color .3s var(--ease-io)}
.card:before{content:"";position:absolute;inset-inline-start:0;top:-1px;height:1px;width:0;background:var(--gold);transition:width .5s var(--ease-io)}
.card:hover:before{width:100%}
.ch{display:flex;align-items:flex-start;gap:12px}
.ch .who{min-width:0;flex:1}
.ch .co{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:var(--ls);text-transform:uppercase}
[dir=rtl] .ch .co{text-transform:none}
.ch h3{font-size:22px;margin:6px 0 0;line-height:1.25;font-weight:300;color:var(--ink);overflow-wrap:anywhere}
.chip,.st{font-size:12px;font-weight:500;padding:5px 10px;border-radius:0;white-space:nowrap;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.chip.done,.st.done{background:var(--green);border-color:var(--green);color:#fff}
.chip.part,.st.part{background:var(--cream);border-color:var(--line);color:var(--green)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0 4px;font-size:13px;color:var(--text-2)}
.meta b{font-weight:500;color:var(--ink)}
.meta .k{color:var(--muted);margin-inline-end:5px}
.prog{margin:16px 0 4px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.prog .row b{color:var(--ink)}
.pbar{height:4px;background:var(--sand);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green)}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:start;padding:8px 6px;border-bottom:1px solid var(--ink);letter-spacing:var(--ls);text-transform:uppercase}
[dir=rtl] th{text-transform:none}
td{padding:10px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:center;width:58px}
td.it{overflow-wrap:anywhere}
td .code{display:block;font-size:12px;color:var(--muted)}
td.ok{color:var(--green);font-weight:500}
td.left{font-weight:500}
td.zero{color:var(--muted)}
details{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px}
summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px;min-height:32px}
summary::-webkit-details-marker{display:none}
summary:before{content:"";width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);transition:transform .3s var(--ease-io)}
[dir=rtl] summary:before{transform:rotate(135deg)}
details[open] summary:before{transform:rotate(45deg)}
.dl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.dl li{border-top:1px solid var(--line-2);padding:10px 0;font-size:14px}
.dl li:first-child{border-top:0}
.dl .h{display:flex;justify-content:space-between;gap:8px;font-weight:500;font-size:13px;color:var(--ink)}
.dl .ln{color:var(--text-2);margin-top:2px}
.empty{font-size:14px;color:var(--muted);margin-top:14px}
.foot{margin-top:clamp(56px,8vw,96px);background:var(--ink);color:#d9d4ca}
.foot .wrap{display:flex;gap:18px;align-items:center;padding-top:34px;padding-bottom:34px;font-size:13px}
.foot .logo{height:46px;color:#fff;flex:0 0 auto}
/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--cream)}
.lbox{width:100%;max-width:400px;background:var(--white);border:1px solid var(--line);border-radius:0;padding:36px 30px 28px;position:relative}
.lbox:before{content:"";position:absolute;inset-inline-start:30px;top:-1px;width:56px;height:1px;background:var(--gold)}
.lbox .logo{height:84px;display:block;margin:0 auto 22px;width:max-content}
.lbox h1{font-size:26px;text-align:center;margin:0 0 6px;font-weight:300;color:var(--green)}
.lbox p{font-size:14px;color:var(--muted);text-align:center;margin:0 0 20px}
label{display:block;font-size:13px;color:var(--text-2);margin:14px 0 6px;font-weight:500}
input{width:100%;font:inherit;font-size:16px;font-weight:400;height:50px;padding:0 14px;border:1px solid #b9b2a4;border-radius:0;background:#fff;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(42,82,80,.15)}
.pw{position:relative}
.pw input{padding-inline-end:70px}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:13px;font-weight:500;padding:8px 10px}
.go{width:100%;margin-top:22px;background:var(--ink);color:#fff;border:0;border-radius:0;height:50px;font-weight:500;font-size:15px;transition:background .3s var(--ease-io)}
.go:hover{background:var(--green)}
.go[disabled]{opacity:.5}
.err{color:#9b2c1f;font-size:14px;margin-top:12px;min-height:1.2em;text-align:center}
.okm{color:var(--green);font-size:14px;margin-top:12px;text-align:center}
.lang{display:block;margin:18px auto 0;border-color:var(--line)}
.hide{display:none!important}
.load{padding:80px 0;text-align:center;color:var(--muted)}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-inline-start:0;padding-inline-start:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:540px){.bar .wrap{height:64px}.bar .logo{height:36px}.bar .t{display:none}.card{padding:18px}.btn{padding:0 11px;height:36px;font-size:13px}.kpi{padding:16px 12px}.kpi:first-child,.kpi:nth-child(3){padding-inline-start:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---------- the PDF / print report (A4 landscape, built from the same data) ---------- */
#report{display:none}
.pg{width:297mm;height:210mm;padding:13mm 16mm 10mm;position:relative;overflow:hidden;background:#fff;color:var(--ink);page-break-after:always;break-after:page;display:flex;flex-direction:column;font-weight:300}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg,.pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cov{background:var(--green);color:#fff;padding:0;flex-direction:row}
.cov .l{flex:0 0 42%;display:flex;align-items:center;justify-content:center;border-inline-end:.25mm solid rgba(255,255,255,.16)}
.cov .l .logo{height:80mm;color:#fff}
.cov .r{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 17mm}
.cov .ey{font-size:9pt;letter-spacing:var(--ls);text-transform:uppercase;color:#f5e6d3;font-weight:500}
[dir=rtl] .cov .ey{text-transform:none}
.cov h1{font-size:36pt;line-height:1.1;margin:5mm 0 4mm;font-weight:300}
.cov .sb{font-size:11.5pt;color:rgba(255,255,255,.78);max-width:122mm;line-height:1.6}
.cov .rule{height:.3mm;width:26mm;background:var(--gold);margin:10mm 0 8mm}
.cov .kp{display:flex;gap:11mm}
.cov .kp div{font-size:8.5pt;color:#f5e6d3;font-weight:500}
.cov .kp b{display:block;font-size:26pt;color:#fff;font-weight:300;line-height:1.15}
.cov .dt{position:absolute;bottom:11mm;inset-inline-end:16mm;font-size:9pt;color:rgba(255,255,255,.6)}
.rh{display:flex;align-items:flex-end;gap:6mm;padding-bottom:4mm;border-bottom:.25mm solid var(--line);margin-bottom:6mm;position:relative}
.rh:after{content:"";position:absolute;bottom:-.25mm;inset-inline-start:0;width:22mm;height:.25mm;background:var(--gold)}
.rh .logo{height:13mm}
.rh .tt{flex:1}
.rh .tt small{display:block;font-size:7.5pt;letter-spacing:var(--ls);text-transform:uppercase;color:var(--muted);font-weight:500}
[dir=rtl] .rh .tt small{text-transform:none}
.rh .tt b{font-size:18pt;font-weight:300;color:var(--green)}
.rh .d{font-size:8.5pt;color:var(--muted);text-align:end}
.rf{margin-top:auto;padding-top:3mm;border-top:.2mm solid var(--line-2);display:flex;justify-content:space-between;align-items:center;font-size:7.5pt;color:var(--muted)}
.rk{display:grid;grid-template-columns:repeat(4,1fr);border-top:.2mm solid var(--line);border-bottom:.2mm solid var(--line);margin-bottom:6mm}
.rk div{padding:3.5mm 5mm;border-inline-start:.2mm solid var(--line)}
.rk div:first-child{border-inline-start:0;padding-inline-start:0}
.rk span{font-size:7.5pt;color:var(--muted);font-weight:500;letter-spacing:var(--ls);text-transform:uppercase}
[dir=rtl] .rk span{text-transform:none}
.rk b{display:block;font-size:24pt;font-weight:300;line-height:1.15}
.rk .g b{color:var(--green)}
.rt{width:100%;border-collapse:collapse;font-size:9pt;margin-top:0}
.rt th{font-size:7pt;color:var(--muted);font-weight:500;text-align:start;padding:2mm;border-bottom:.25mm solid var(--ink);letter-spacing:var(--ls);text-transform:uppercase}
[dir=rtl] .rt th{text-transform:none}
.rt td{padding:2.6mm 2mm;border-bottom:.2mm solid var(--line-2);vertical-align:middle}
.rt .c{text-align:center}
.rt .nm b{display:block;font-weight:400}
.rt .nm span{font-size:7.5pt;color:var(--muted)}
.mb{display:flex;align-items:center;gap:2mm;min-width:34mm}
.mb i{flex:1;height:1mm;background:var(--sand);overflow:hidden;display:block}
.mb i em{display:block;height:100%;background:var(--green)}
.mb span{font-size:8pt;font-weight:500;min-width:9mm;text-align:end}
.pg .st{font-size:7pt;padding:.7mm 2.2mm}
.cp{display:grid;grid-template-columns:1fr 1fr;gap:8mm;flex:1;min-height:0}
.cc{border:.2mm solid var(--line);padding:5.5mm 6mm;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.cc:before{content:"";position:absolute;top:-.2mm;inset-inline-start:6mm;width:16mm;height:.25mm;background:var(--gold)}
.cc .co{font-size:7.5pt;color:var(--muted);font-weight:500;letter-spacing:var(--ls);text-transform:uppercase}
[dir=rtl] .cc .co{text-transform:none}
.cc h3{font-size:15pt;margin:1.2mm 0 3mm;line-height:1.25;font-weight:300;color:var(--green)}
.cc .mt{display:flex;flex-wrap:wrap;align-items:center;gap:1mm 6mm;font-size:8.5pt;color:var(--text-2);margin-bottom:3.5mm}
.cc .mt b{color:var(--ink);font-weight:500}
.cc .mt .k{color:var(--muted);margin-inline-end:1.5mm}
.cc .pr{display:flex;justify-content:space-between;font-size:8.5pt;color:var(--muted);margin-bottom:1.6mm}
.cc .pr b{color:var(--ink)}
.cc .bar{height:1.1mm;background:var(--sand);overflow:hidden}
.cc .bar em{display:block;height:100%;background:var(--green)}
.cc table{font-size:8.5pt;margin-top:4.5mm}
.cc th{font-size:6.8pt;padding:1.6mm 1.5mm;border-bottom-width:.25mm}
.cc td{padding:2mm 1.5mm}
.cc .dls{margin-top:3.5mm;font-size:7.8pt;color:var(--text-2)}
.cc .dls b{display:block;font-size:7pt;color:var(--muted);font-weight:500;margin-bottom:1mm;letter-spacing:var(--ls);text-transform:uppercase}
[dir=rtl] .cc .dls b{text-transform:none}
.cc .dls div{padding:1.3mm 0;border-top:.2mm solid var(--line-2)}
.cc .dls .n{font-weight:500;color:var(--ink)}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff!important}
  body>*:not(#report){display:none!important}
  #report{display:block}
}
</style>
</head>

      upd: 'Last updated', contracts: 'Contracts', pieces: 'Total pieces', delivered: 'Delivered', left: 'Remaining', of: 'of',
      secT: 'Contractors', secS: 'by purchase order / contract', po: 'PO', contract: 'Contract', dated: 'dated', due: 'Delivery date', lastDel: 'Last delivery',
      st: { done: 'Fully delivered', part: 'Partly delivered', work: 'In production' },
      item: 'Item', qty: 'Contracted', got: 'Delivered', rem: 'Left', dels: 'Delivery notes', prior: 'Earlier delivery (before system records)', none: 'Nothing delivered yet.', dn: 'Note',
      foot: 'Data comes straight from the lōf factory system and updates automatically. Quantities only — no prices.', repEy: 'Site Furniture — supply status', repT: 'Contractors\' supply status', repSum: 'Contracts summary', repDet: 'Contract details', contractor: 'Contractor', project: 'Project (as on the document)', ref: 'Reference', prog: 'Progress', status: 'Status', asOf: 'As of', page: 'Page', repFoot: 'lōf outdoor furniture — quantities only, no prices', coverSub: 'Site furniture supply position per contractor: contracted quantities, what was delivered on signed delivery notes, what is left and the delivery date.', allDone: 'complete', pct: '%'
    }
  };
  var lang = LS.get(K.lang) === 'en' ? 'en' : 'ar';
  var T = function (k) { return D[lang][k]; };
  var data = null;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var L = function (o) { return o ? (lang === 'en' ? (o.en || o.ar || '') : (o.ar || o.en || '')) : ''; };
  var dt = function (s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? m[3] + '/' + m[2] + '/' + m[1] : '—'; };
  var stamp = function (iso) { try { return new Intl.DateTimeFormat(lang === 'en' ? 'en-GB' : 'ar-EG-u-nu-latn', { timeZone: 'Africa/Cairo', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)); } catch (e) { return String(iso || '').slice(0, 16); } };
  var pct = function (a, b) { return b > 0 ? Math.round(a * 100 / b) : 0; };

  function applyLang() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.body.classList.toggle('en', lang === 'en');
    var nodes = document.querySelectorAll('[data-t]'); for (var i = 0; i < nodes.length; i++) { var v = T(nodes[i].getAttribute('data-t')); if (typeof v === 'string') nodes[i].textContent = v; }
    var lb = document.querySelectorAll('[data-act=lang]'); for (var j = 0; j < lb.length; j++) lb[j].textContent = T('lang');
    document.title = 'lōf — ' + (lang === 'en' ? 'Supply status' : 'حالة التوريدات');
    if (data) render();
  }
  function show(v) { ['vLoad', 'vLogin', 'vSetup', 'vMain'].forEach(function (x) { $(x).classList.toggle('hide', x !== v); }); }
  function call(body, auth) {
    var h = { 'content-type': 'application/json' }; if (auth) h.Authorization = 'Bearer ' + auth;
    return fetch(API, { method: 'POST', headers: h, body: JSON.stringify(body), cache: 'no-store', credentials: 'omit' })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.__s = r.status; return j; }); });
  }

  /* ---------------- main view ---------------- */
  function render() {
    var d = data, cs = d.contracts || [];
    var q = 0, g = 0; cs.forEach(function (c) { q += c.qty; g += c.done; });
    var groups = []; var gi = {};
    cs.forEach(function (c) { var k = L(c.contractor) || '—'; if (!(k in gi)) { gi[k] = groups.length; groups.push({ name: k, list: [] }); } groups[gi[k]].list.push(c); });
    var h = '';
    h += '<section class="hero"><div class="eyebrow"><span>' + esc(T('eyebrow')) + '</span><span>' + esc(L(d.client)) + '</span></div><h1>' + esc(T('h1')(L(d.client), L(d.project))) + '</h1><p>' + esc(T('sub')) + '</p>';
    h += '<div class="upd">' + esc(T('upd')) + ': <bdi>' + esc(stamp(d.at)) + '</bdi></div></section>';
    h += '<div class="kpis">' + kpi(T('contracts'), cs.length) + kpi(T('pieces'), q) + kpi(T('delivered'), g, 'acc') + kpi(T('left'), q - g) + '</div>';
    h += '<div class="bigbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct(g, q) + '"><i style="width:' + pct(g, q) + '%"></i></div>';
    h += '<div class="bigcap"><span><span class="num">' + g + '</span> ' + esc(T('of')) + ' <span class="num">' + q + '</span></span><span class="num">' + pct(g, q) + '%</span></div>';
    groups.forEach(function (gr) {
      h += '<div class="sec"><h2>' + esc(gr.name) + '</h2><span>' + esc(gr.list.length > 1 ? (gr.list.length + ' ' + T('contracts')) : T('secS')) + '</span></div><div class="grid">';
      gr.list.forEach(function (c) { h += card(c); });
      h += '</div>';
    });
    $('main').innerHTML = h;
    $('foot').innerHTML = '<div class="wrap"><span class="logo">' + LOGO + '</span><span>' + esc(T('foot')) + '</span></div>';
    try { report(); } catch (e) { /* the print report is extra */ }
  }
  function kpi(l, v, cls) { return '<div class="kpi ' + (cls || '') + '"><div class="l">' + esc(l) + '</div><div class="v num">' + esc(v) + '</div></div>'; }
  function card(c) {
    var p = pct(c.done, c.qty);
    var h = '<article class="card"><div class="ch"><div class="who"><div class="co">' + esc(L(c.contractor)) + '</div><h3>' + esc(L(c.name)) + '</h3></div>';
    h += '<span class="chip ' + esc(c.state) + '">' + esc(T('st')[c.state] || '') + '</span></div>';
    h += '<div class="meta"><span><span class="k">' + esc(c.refKind === 'contract' ? T('contract') : T('po')) + '</span><b class="num">' + esc(c.ref) + '</b></span>';
    if (c.refDate) h += '<span><span class="k">' + esc(T('dated')) + '</span><b class="num">' + esc(dt(c.refDate)) + '</b></span>';
    if (c.state !== 'done' && c.due) h += '<span><span class="k">' + esc(T('due')) + '</span><b class="num">' + esc(dt(c.due)) + '</b></span>';
    if (c.lastDel) h += '<span><span class="k">' + esc(T('lastDel')) + '</span><b class="num">' + esc(dt(c.lastDel)) + '</b></span>';
    h += '</div>';
    h += '<div class="prog"><div class="row"><span>' + esc(T('delivered')) + ' <b class="num">' + c.done + '</b> ' + esc(T('of')) + ' <b class="num">' + c.qty + '</b></span><b class="num">' + p + '%</b></div><div class="pbar"><i style="width:' + p + '%"></i></div></div>';
    h += '<table><thead><tr><th>' + esc(T('item')) + '</th><th class="n">' + esc(T('qty')) + '</th><th class="n">' + esc(T('got')) + '</th><th class="n">' + esc(T('rem')) + '</th></tr></thead><tbody>';
    (c.items || []).forEach(function (it) {
      h += '<tr><td class="it">' + esc(lang === 'en' ? it.en : it.ar) + (it.code ? '<span class="code num">' + esc(it.code) + '</span>' : '') + '</td><td class="n num">' + it.qty + '</td><td class="n num ' + (it.done ? 'ok' : 'zero') + '">' + it.done + '</td><td class="n num ' + (it.left ? 'left' : 'zero') + '">' + it.left + '</td></tr>';
    });
    h += '</tbody></table>';
    var ds = c.deliveries || [];
    if (!ds.length) h += '<div class="empty">' + esc(T('none')) + '</div>';
    else {
      h += '<details><summary>' + esc(T('dels')) + ' (<span class="num">' + ds.length + '</span>)</summary><ul class="dl">';
      ds.forEach(function (z) {
        h += '<li><div class="h"><span>' + (z.prior ? esc(T('prior')) : esc(T('dn')) + ' <span class="num">' + esc(z.no) + '</span>') + '</span><span class="num">' + (z.date ? esc(dt(z.date)) : '') + '</span></div>';
        h += '<div class="ln">' + z.lines.map(function (l) { return '<span class="num">' + l.qty + '</span> × ' + esc(lang === 'en' ? l.en : l.ar); }).join(' · ') + '</div></li>';
      });
      h += '</ul></details>';
    }
    return h + '</article>';
  }

  /* ---------------- the PDF / print report ---------------- */
  function report() {
    var d = data, cs = d.contracts || []; var q = 0, g = 0; cs.forEach(function (c) { q += c.qty; g += c.done; });
    var day = dt(cairoDay(d.at)); var pages = [];
    var foot = function (n, tot) { return '<div class="rf"><span>' + esc(T('repFoot')) + '</span><span class="num">' + esc(T('page')) + ' ' + n + ' / ' + tot + '</span></div>'; };
    var head = function (t) { return '<div class="rh"><span class="logo">' + LOGO + '</span><div class="tt"><small>' + esc(T('repEy')) + '</small><b>' + esc(t) + '</b></div><div class="d">' + esc(L(d.client)) + ' — ' + esc(L(d.project)) + '<br>' + esc(T('asOf')) + ' <span class="num">' + esc(day) + '</span></div></div>'; };
    /* cover */
    pages.push('<section class="pg cov"><div class="l"><span class="logo">' + LOGO + '</span></div><div class="r"><div class="ey">' + esc(T('repEy')) + '</div><h1>' + esc(L(d.client)) + '<br>' + esc(L(d.project)) + '</h1><div class="sb">' + esc(T('coverSub')) + '</div><div class="rule"></div>' +
      '<div class="kp"><div>' + esc(T('contracts')) + '<b class="num">' + cs.length + '</b></div><div>' + esc(T('pieces')) + '<b class="num">' + q + '</b></div><div class="g">' + esc(T('delivered')) + '<b class="num">' + g + '</b></div><div>' + esc(T('left')) + '<b class="num">' + (q - g) + '</b></div></div></div>' +
      '<div class="dt">' + esc(T('asOf')) + ' <span class="num">' + esc(day) + '</span></div></section>');
    /* summary */
    var rows = cs.map(function (c) { var p = pct(c.done, c.qty);
      return '<tr><td class="nm"><b>' + esc(L(c.contractor)) + '</b></td><td class="nm"><b>' + esc(L(c.name)) + '</b><span class="num">' + esc(c.ref) + '</span></td><td class="c num">' + c.qty + '</td><td class="c num">' + c.done + '</td><td class="c num">' + (c.qty - c.done) + '</td>' +
        '<td><div class="mb"><i><em style="width:' + p + '%"></em></i><span class="num">' + p + '%</span></div></td><td class="c num">' + (c.state === 'done' ? '—' : esc(dt(c.due))) + '</td><td><span class="st ' + esc(c.state) + '">' + esc(T('st')[c.state] || '') + '</span></td></tr>'; }).join('');
    pages.push('<section class="pg">' + head(T('repSum')) +
      '<div class="rk"><div><span>' + esc(T('contracts')) + '</span><b class="num">' + cs.length + '</b></div><div><span>' + esc(T('pieces')) + '</span><b class="num">' + q + '</b></div><div class="g"><span>' + esc(T('delivered')) + '</span><b class="num">' + g + '</b></div><div><span>' + esc(T('left')) + '</span><b class="num">' + (q - g) + '</b></div></div>' +
      '<table class="rt"><thead><tr><th>' + esc(T('contractor')) + '</th><th>' + esc(T('project')) + '</th><th class="c">' + esc(T('qty')) + '</th><th class="c">' + esc(T('got')) + '</th><th class="c">' + esc(T('rem')) + '</th><th>' + esc(T('prog')) + '</th><th class="c">' + esc(T('due')) + '</th><th>' + esc(T('status')) + '</th></tr></thead><tbody>' + rows + '</tbody></table>@@FOOT@@</section>');
    /* details: two contracts a page — a contractor with two contracts gets its own page */
    var groups = []; var gi = {};
    cs.forEach(function (c) { var k = L(c.contractor); if (!(k in gi)) { gi[k] = groups.length; groups.push([]); } groups[gi[k]].push(c); });
    var pairs = []; var single = [];
    groups.forEach(function (gr) { if (gr.length === 2) pairs.push(gr); else gr.forEach(function (c) { single.push(c); }); });
    for (var i = 0; i < single.length; i += 2) pairs.push(single.slice(i, i + 2));
    pairs.sort(function (a, b) { return cs.indexOf(a[0]) - cs.indexOf(b[0]); });
    pairs.forEach(function (pr) { pages.push('<section class="pg">' + head(T('repDet')) + '<div class="cp">' + pr.map(rcard).join('') + '</div>@@FOOT@@</section>'); });
    var tot = pages.length;
    $('report').innerHTML = pages.map(function (h, k) { return h.replace('@@FOOT@@', foot(k + 1, tot)); }).join('');
  }
  function rcard(c) {
    var p = pct(c.done, c.qty);
    var h = '<div class="cc"><div class="co">' + esc(L(c.contractor)) + '</div><h3>' + esc(L(c.name)) + '</h3><div class="mt"><span><span class="k">' + esc(c.refKind === 'contract' ? T('contract') : T('po')) + '</span><b class="num">' + esc(c.ref) + '</b></span>' +
      (c.refDate ? '<span><span class="k">' + esc(T('dated')) + '</span><b class="num">' + esc(dt(c.refDate)) + '</b></span>' : '') +
      (c.state !== 'done' && c.due ? '<span><span class="k">' + esc(T('due')) + '</span><b class="num">' + esc(dt(c.due)) + '</b></span>' : '') +
      '<span class="st ' + esc(c.state) + '">' + esc(T('st')[c.state] || '') + '</span></div>' +
      '<div class="pr"><span>' + esc(T('delivered')) + ' <b class="num">' + c.done + '</b> ' + esc(T('of')) + ' <b class="num">' + c.qty + '</b></span><b class="num">' + p + '%</b></div><div class="bar"><em style="width:' + p + '%"></em></div>';
    h += '<table><thead><tr><th>' + esc(T('item')) + '</th><th class="n">' + esc(T('qty')) + '</th><th class="n">' + esc(T('got')) + '</th><th class="n">' + esc(T('rem')) + '</th></tr></thead><tbody>' + (c.items || []).map(function (it) {
      return '<tr><td class="it">' + esc(lang === 'en' ? it.en : it.ar) + '</td><td class="n num">' + it.qty + '</td><td class="n num ' + (it.done ? 'ok' : 'zero') + '">' + it.done + '</td><td class="n num ' + (it.left ? 'left' : 'zero') + '">' + it.left + '</td></tr>'; }).join('') + '</tbody></table>';
    var ds = c.deliveries || [];
    h += '<div class="dls"><b>' + esc(T('dels')) + '</b>' + (ds.length ? ds.map(function (z) {
      return '<div><span class="n">' + (z.prior ? esc(T('prior')) : esc(T('dn')) + ' <span class="num">' + esc(z.no) + '</span>') + (z.date ? ' · <span class="num">' + esc(dt(z.date)) + '</span>' : '') + '</span> — ' + z.lines.map(function (l) { return '<span class="num">' + l.qty + '</span> × ' + esc(lang === 'en' ? l.en : l.ar); }).join(' · ') + '</div>'; }).join('') : '<div>' + esc(T('none')) + '</div>') + '</div>';
    return h + '</div>';
  }
  var cairoDay = function (iso) { try { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso)); } catch (e) { return String(iso || '').slice(0, 10); } };
  function load() {
    var tok = LS.get(K.tok), exp = LS.get(K.exp);
    if (!tok || (exp && Date.parse(exp) < Date.now())) { LS.set(K.tok, null); show('vLogin'); return; }
    show('vLoad');
    call({ action: 'data', token: tok }).then(function (j) {
      if (j.__s === 401) { LS.set(K.tok, null); show('vLogin'); return; }
      if (!j.ok) { $('vLoad').textContent = T('net'); return; }
      data = j; render(); show('vMain');
    }).catch(function () { $('vLoad').textContent = T('net'); });
  }

  /* ---------------- login ---------------- */
  $('pShow').onclick = function () { var i = $('p'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? T('show') : T('hidep'); };
  $('fLogin').onsubmit = function (e) {
    e.preventDefault(); var b = $('goLogin'); b.disabled = true; b.textContent = T('wait'); $('eLogin').textContent = '';
    call({ action: 'login', user: $('u').value, pass: $('p').value }).then(function (j) {
      b.disabled = false; b.textContent = T('enter');
      if (j.ok && j.token) { LS.set(K.tok, j.token); LS.set(K.exp, j.exp || ''); $('p').value = ''; load(); return; }
      $('eLogin').textContent = j.__s === 429 ? T('locked') : (j.__s === 401 || j.__s === 400) ? T('bad') : T('net');
    }).catch(function () { b.disabled = false; b.textContent = T('enter'); $('eLogin').textContent = T('net'); });
  };
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('[data-act]'); if (!a) return; var k = a.getAttribute('data-act');
    if (k === 'lang') { lang = lang === 'en' ? 'ar' : 'en'; LS.set(K.lang, lang); applyLang(); }
    else if (k === 'print') { try { report(); } catch (e) {} window.print(); }
    else if (k === 'out') { var t = LS.get(K.tok); LS.set(K.tok, null); LS.set(K.exp, null); data = null; $('report').innerHTML = ''; if (t) call({ action: 'logout', token: t }).catch(function () {}); $('main').innerHTML = ''; show('vLogin'); }
  });

  /* ---------------- owner setup (#setup): uses the owner's factory-system session on this same site ---------------- */
  function ownerToken() {
    try { var s = JSON.parse(LS.get(SB) || 'null'); if (s && s.access_token && (!s.expires_at || s.expires_at * 1000 > Date.now() + 30000)) return s.access_token; } catch (e) {}
    return null;
  }
  function setup() {
    show('vSetup'); document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
    var at = ownerToken(), info = $('sInfo'), go = $('goSetup');
    if (!at) { info.textContent = 'افتح السيستم (ninetystudioz.github.io) على نفس المتصفح وسجّل دخول بحساب الإدارة، وبعدين ارجع للصفحة دي.'; go.disabled = true; return; }
    call({ action: 'whoami' }, at).then(function (j) {
      if (!j.admin) { info.textContent = 'الصفحة دي للإدارة بس.'; go.disabled = true; return; }
      var us = (j.users || []).filter(function (x) { return x.u !== 'nftest'; });
      info.textContent = us.length ? ('الحسابات الموجودة: ' + us.map(function (x) { return x.u + ' (' + (x.n || '') + ')'; }).join('، ') + ' — اكتب نفس الاسم عشان تغيّر الباسورد.') : 'مفيش حساب لسه — اعمل حساب ميدار.';
    }).catch(function () { info.textContent = 'تعذّر الاتصال.'; });
    $('spShow').onclick = function () { var i = $('sp'); i.type = i.type === 'password' ? 'text' : 'password'; this.textContent = i.type === 'password' ? 'إظهار' : 'إخفاء'; };
    $('fSetup').onsubmit = function (e) {
      e.preventDefault(); $('eSetup').textContent = ''; $('okSetup').classList.add('hide');
      if ($('sp').value !== $('sp2').value) { $('eSetup').textContent = 'الباسوردين مش زي بعض.'; return; }
      var tok = ownerToken(); if (!tok) { $('eSetup').textContent = 'الدخول على السيستم خلص — افتح السيستم وارجع.'; return; }
      go.disabled = true;
      call({ action: 'setpass', user: $('su').value, name: $('sn').value, pass: $('sp').value }, tok).then(function (j) {
        go.disabled = false;
        if (j.ok) { $('sp').value = ''; $('sp2').value = ''; var m = $('okSetup'); m.textContent = 'اتحفظ ✓ — اسم المستخدم: ' + j.user + '. ابعتهم لميدار مع اللينك.'; m.classList.remove('hide'); return; }
        $('eSetup').textContent = j.error === 'short' ? 'الباسورد لازم 8 حروف على الأقل.' : j.error === 'user' ? 'اسم المستخدم: حروف إنجليزي صغيرة وأرقام بس (3 لـ 40).' : j.error === 'forbidden' ? 'للإدارة بس.' : 'حصلت مشكلة — جرّب تاني.';
      }).catch(function () { go.disabled = false; $('eSetup').textContent = 'تعذّر الاتصال.'; });
    };
  }

  var LOGO = document.querySelector('.bar .logo').innerHTML;
  applyLang();
  if (/^#setup/.test(location.hash)) setup(); else load();
})();
</script>
